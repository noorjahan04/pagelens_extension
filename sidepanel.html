<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageLens</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>PageLens</span></div>
  </header>

  <section id="chip" class="chip">
    <div class="chip-main">
      <img id="favicon" alt="" width="18" height="18">
      <div class="chip-text">
        <div id="chipTitle" class="chip-title">Reading page…</div>
        <div id="chipMeta" class="chip-meta"></div>
      </div>
    </div>
    <button id="refreshBtn" class="icon-btn" aria-label="Re-scan this page" title="Re-scan this page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </section>

  <section class="actions" aria-label="Quick actions">
    <button class="act act-sum" data-kind="summarize">Summarize</button>
    <button class="act act-exp" data-kind="explain">Explain</button>
    <button class="act act-ask" data-kind="ask">Ask</button>
  </section>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything about this page…"></textarea>
      <button id="sendBtn" class="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
